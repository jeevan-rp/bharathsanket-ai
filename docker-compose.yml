# Docker Compose for local development
# Usage: docker-compose up --build

services:
  bharatsanket:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/bharatsanket
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8080
    restart: unless-stopped

  # Optional: local MongoDB for testing
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
